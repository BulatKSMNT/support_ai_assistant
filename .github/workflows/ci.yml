name: Service checks
on:
  push:
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.28"
      - run: uv sync --locked --extra dev
      - run: uv run --no-sync ruff check app scripts tests
      - run: uv run --no-sync ruff format --check app scripts tests
      - run: uv run --no-sync pytest -q
